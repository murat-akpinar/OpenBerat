user nginx;
worker_processes auto;
pid /run/nginx.pid;

# Everything goes to the container's stdout/stderr so `docker logs -f` is the
# one place to look.
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # One line per request, in the order questions get asked at 3am:
    # when, who, which app, what, the verdict, and where the time went.
    # Phase 1 adds the identity fields (auth_request_set → $auth_user etc.)
    # once the /decide wiring exists.
    log_format openberat '$time_iso8601 $remote_addr $host "$request" '
                         '$status ${body_bytes_sent}b rt=${request_time}s '
                         'up="$upstream_addr" urt="$upstream_response_time" '
                         '"$http_user_agent"';
    access_log /dev/stdout openberat;

    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
