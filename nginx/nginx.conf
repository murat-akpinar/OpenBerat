user nginx;
worker_processes auto;
pid /run/nginx.pid;

# Everything goes to the container's stdout/stderr so `docker logs -f` is the
# one place to look.
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Transport and the response headers, both shared with breakglass.conf so
    # the two configurations cannot drift apart on either.
    include /etc/nginx/conf.d/tls.inc;
    include /etc/nginx/conf.d/security.inc;

    # One line per request, in the order questions get asked at 3am:
    # when, who, which app, what, the verdict, and where the time went.
    #
    # `user` and `deny` are lifted off /decide's response by auth_request_set
    # in protected.inc, and are empty on the anonymous hosts — the variables
    # exist globally once any location declares them, so the format is valid
    # everywhere. The reason a request was refused is here and **only** here:
    # the client is told 403 and nothing more (docs/02).
    #
    # `id` is $request_id, the same value decide.inc sends the backend as
    # X-Request-Id and the same value that ends up in audit_event.request_id —
    # which is what makes a line in this log and a row in that table findable
    # from each other.
    log_format openberat '$time_iso8601 $remote_addr $host "$request" '
                         '$status ${body_bytes_sent}b rt=${request_time}s '
                         'user="$auth_username" deny="$deny_reason" id=$request_id '
                         'up="$upstream_addr" urt="$upstream_response_time" '
                         '"$http_user_agent"';
    access_log /dev/stdout openberat;

    # Docker's embedded DNS, at a fixed address inside every container. nginx
    # otherwise resolves upstream names once, at startup, and refuses to start
    # at all if one of them is down — one stopped container would take the
    # whole PEP with it, and ADR-0011 generates application blocks whose
    # upstreams may legitimately not exist yet. Paired with a variable in
    # proxy_pass, resolution moves to request time and a missing upstream
    # costs one 502 instead of the door.
    resolver 127.0.0.11 ipv6=off valid=10s;

    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
    # The application blocks the backend generates (ADR-0011) — the one file
    # that is not baked into the image, because it changes when an admin adds
    # an application and nobody should build an image for that. The glob
    # matches nothing on a fresh install, which is correct: there are no
    # applications yet. `*.conf` also means the staged and rolled-back copies
    # beside it are not read.
    include /etc/nginx/conf.d/generated/*.conf;
}
