# BREAK-GLASS. A second, complete nginx configuration shipped inside the same
# image (ADR-0017), used when the identity chain is broken and the applications
# behind it have to come back before it is repaired.
#
# It serves the protected applications with **no authorisation at all**. That is
# the point and it is also the danger: while this is running, everyone who can
# reach the network can reach every application. It is an incident action with a
# time box, not a fallback — which is why it is a separate profile that somebody
# has to switch on, and never something that happens by itself.
#
# The procedure, including how to go back, is docs/08-breakglass.md.

user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr notice;

# Break-glass is reloaded by hand rather than by ADR-0011, but the worker that
# lingers behind a long-lived connection is the same one. Kept identical to
# nginx.conf on purpose: a main-context directive cannot live in a shared
# include, so CI checks the two copies agree (ADR-0025).
worker_shutdown_timeout 300s;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Authorisation is what break-glass gives up, and nothing else.
    include /etc/nginx/conf.d/tls.inc;
    include /etc/nginx/conf.d/security.inc;
    include /etc/nginx/conf.d/logredact.inc;

    # Deliberately not the normal format: every line says BREAKGLASS, so a log
    # search after the incident can tell which requests were served unprotected
    # and nobody has to reconstruct the window from memory.
    log_format breakglass 'BREAKGLASS $time_iso8601 $remote_addr $host "$safe_request" '
                          '$status ${body_bytes_sent}b rt=${request_time}s '
                          '"$http_user_agent"';
    access_log /dev/stdout breakglass;

    resolver 127.0.0.11 ipv6=off valid=10s;
    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/breakglass/*.conf;

    # --- Feature Start ---
    # The application blocks, generated from the same `application` table as the
    # normal configuration's and by the same validators (ADR-0030). Hand-written
    # here, they were two lab hostnames — so this configuration restored the lab
    # and answered 404 to every real application, which is the one thing it
    # exists not to do.
    # A **glob**, so an install where the backend has never written the file
    # still starts and serves nothing, rather than refusing to start on a
    # missing `include`. And the name does not end in `.conf`: `nginx.conf`
    # globs `conf.d/generated/*.conf`, and one of these blocks reaching the
    # *running* configuration would serve an application with no authorisation
    # at all, with `nginx -t` reporting success.
    # --- Feature End ---
    include /etc/nginx/conf.d/generated/*.apps;
}
