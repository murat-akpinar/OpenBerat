# The protected applications, served directly. Mirrors 20-apps.conf minus the
# authorisation — same hostnames, same upstreams, so nothing on the client side
# has to change while this is active.

server {
    listen 80 default_server;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    ssl_certificate     /etc/nginx/certs/wildcard.crt;
    ssl_certificate_key /etc/nginx/certs/wildcard.key;
    return 404;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sample.apps.example.local;
    ssl_certificate     /etc/nginx/certs/wildcard.crt;
    ssl_certificate_key /etc/nginx/certs/wildcard.key;

    location / {
        include /etc/nginx/breakglass/upstream.inc;
        set $upstream sample-app;
        proxy_pass http://$upstream:80;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ws.apps.example.local;
    ssl_certificate     /etc/nginx/certs/wildcard.crt;
    ssl_certificate_key /etc/nginx/certs/wildcard.key;

    location / {
        include /etc/nginx/breakglass/upstream.inc;
        set $upstream sample-ws;
        proxy_pass http://$upstream:8080;
    }
}
