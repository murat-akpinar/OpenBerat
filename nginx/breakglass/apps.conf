# The hosts break-glass answers on that are not applications: the :80 redirect
# and the default server. The application blocks themselves are **generated**,
# from the same `application` table as the running configuration's and by the
# same validators (ADR-0030) — `breakglass.conf` includes them from
# `conf.d/generated/*.apps`. They used to be written out here, which meant this
# file listed two lab hostnames and a real deployment got 404s from the one
# procedure that exists to give it its applications back.

server {
    listen 80 default_server;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    return 404;
}
