# Protected applications. Hand-written here for the two lab samples; ADR-0011
# generates this file from the `application` table in Phase 4, and these blocks
# are the template it generates against. Every one of them is the same three
# lines: a constant $app_slug, the two includes, and a proxy_pass.
#
# ponytail: `example.local` is the lab domain, also in oauth2-proxy.cfg and the
# realm export. The generator in Phase 4 is what removes the repetition.

server {
    listen 443 ssl;
    http2 on;
    server_name sample.apps.example.local;

    ssl_certificate     /etc/nginx/certs/wildcard.crt;
    ssl_certificate_key /etc/nginx/certs/wildcard.key;

    # The application's identity, fixed here and never taken from the request.
    set $app_slug sample;

    include /etc/nginx/conf.d/errors.inc;
    include /etc/nginx/conf.d/decide.inc;

    location / {
        include /etc/nginx/conf.d/protected.inc;
        set $upstream sample-app;
        proxy_pass http://$upstream:80;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ws.apps.example.local;

    ssl_certificate     /etc/nginx/certs/wildcard.crt;
    ssl_certificate_key /etc/nginx/certs/wildcard.key;

    set $app_slug ws;

    include /etc/nginx/conf.d/errors.inc;
    include /etc/nginx/conf.d/decide.inc;

    location / {
        include /etc/nginx/conf.d/protected.inc;
        set $upstream sample-ws;
        proxy_pass http://$upstream:8080;
    }
}
