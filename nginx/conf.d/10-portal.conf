# The portal host and the Keycloak host — the two anonymous-facing servers
# (docs/02, "Anonymous endpoints"). Protected application hosts are generated
# from the DB into 20-apps.conf (ADR-0011) and are not here.
#
# ponytail: `example.local` is the lab domain, also written out in
# oauth2-proxy.cfg and the realm export. Upgrade path when a second deployment
# exists: the nginx image's own /etc/nginx/templates envsubst pass.

# --- The OIDC dance lives on one host --------------------------------------
# The session cookie is shared across .apps.example.local (ADR-0015), so a
# login completed here counts everywhere. One host means one redirect URI to
# register in Keycloak instead of one per application.
server {
    listen 443 ssl;
    http2 on;
    server_name portal.apps.example.local;

    ssl_certificate     /etc/nginx/certs/wildcard.crt;
    ssl_certificate_key /etc/nginx/certs/wildcard.key;

    root /usr/share/nginx/html;

    # @signin, @denied and the unavailable page (00-auth.conf). @denied is
    # never reached from here — the portal is open to every authenticated user
    # and makes no policy decision — but sharing the file is what keeps the
    # sign-in handler identical everywhere.
    include /etc/nginx/conf.d/errors.inc;

    # Anonymous, and it has to be: putting the login flow behind the login
    # flow means nobody can ever authenticate (docs/02).
    location /oauth2/ {
        set $oauth2_proxy oauth2-proxy;   # a variable defers DNS to request time
        proxy_pass http://$oauth2_proxy:4180;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # The subrequest target. No body goes to it, and the response is where the
    # refreshed session cookie appears — see the relay in `location /`.
    location = /oauth2/auth {
        set $oauth2_proxy oauth2-proxy;
        proxy_pass http://$oauth2_proxy:4180;

        # A user in many AD groups makes this response header large: every
        # group name arrives comma-joined in one X-Auth-Request-Groups. nginx
        # reads a response *header block* into a single buffer of this size
        # (one page, 4k here) and answers 502 when it overflows — and
        # auth_request turns a 502 into a 500 for the client, a total lockout
        # rather than a deny. Measured (docs/07): 100 groups fit in 4k, 200 do
        # not. 32k holds roughly a thousand group names; the buffer is
        # allocated per in-flight subrequest, so the cost is bytes, not risk.
        proxy_buffer_size 32k;
        # Raising the header buffer alone makes nginx refuse to start:
        # proxy_busy_buffers_size defaults to twice proxy_buffer_size and
        # must stay below the proxy_buffers pool minus one buffer (8x4k by
        # default). The pool itself is never used here — a subrequest
        # response has no body — it only has to be large enough to be legal.
        proxy_buffers 4 32k;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri  $request_uri;
        proxy_set_header Content-Length   "";
        proxy_pass_request_body off;
    }

    # The portal is open to every *authenticated* user, so its auth_request
    # goes to /oauth2/auth directly rather than to /decide — authentication
    # without a policy decision. A DENY here would send the user to /denied,
    # which lives on this same host, and the redirect would loop (docs/02).
    location / {
        auth_request /oauth2/auth;
        error_page 401 = @signin;
        # Never a bare 500 if oauth2-proxy or Redis is down (README rule 9).
        error_page 500 502 503 504 /unavailable.html;

        # ADR-0006 lives or dies on these two lines: while oauth2-proxy is
        # performing cookie_refresh the new session cookie comes back on the
        # *subrequest's* response, and nothing relays it to the browser unless
        # we lift it out by hand. Miss this and the refresh silently never
        # sticks — the session keeps its original groups until cookie_expire.
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie always;

        # `$uri.html` is what serves /denied from denied.html. `=404` last means
        # every argument is tried as a *file* and served in place: a bare URI,
        # `$uri/`, an `index` directive or a directory match would internally
        # redirect instead — and an internal redirect re-runs the access phase,
        # firing auth_request a second time. The second subrequest finds
        # nothing left to refresh, returns no Set-Cookie, and overwrites
        # $auth_cookie with an empty string: the refresh is silently lost and
        # the decision load doubles. Measured, both halves, in docs/07.
        try_files $uri $uri.html /index.html =404;
    }

}

# --- Keycloak ---------------------------------------------------------------
# Anonymous for the same reason as /oauth2/: the browser is redirected here to
# log in. Only the paths the login flow needs are proxied — /admin (the admin
# console) and /metrics are deliberately absent, not merely restricted.
server {
    listen 443 ssl;
    http2 on;
    server_name auth.apps.example.local;

    ssl_certificate     /etc/nginx/certs/wildcard.crt;
    ssl_certificate_key /etc/nginx/certs/wildcard.key;

    location ~ ^/(realms|resources)/ {
        set $keycloak keycloak;
        proxy_pass http://$keycloak:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Keycloak runs with KC_PROXY_HEADERS=xforwarded and builds every issuer
        # and redirect URL from these. Wrong values here mean a token whose
        # `iss` does not match what oauth2-proxy validates.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        # Keycloak has no use for our session cookie and forwarding it hands a
        # credential valid for every host on .apps.<domain> to a service that
        # access-logs requests (README rule 16). Keycloak's own cookies pass
        # through — the map removes one name, not the header.
        proxy_set_header Cookie            $upstream_cookie;
    }

    location / {
        return 404;
    }
}
