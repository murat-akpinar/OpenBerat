# http-level pieces the authorisation wiring needs. The `.inc` files beside this
# one are the parts that go *inside* a server or a location; they are not named
# `.conf` because nginx.conf includes `conf.d/*.conf` into `http` and a bare
# `location` block there is a syntax error.
#
#   errors.inc     @signin / @denied / @unavailable   -> server level
#   decide.inc     location = /decide                 -> server level
#   protected.inc  auth_request and the header rewrite -> inside a location

# --- Feature Start ---
# The session cookie is removed from the Cookie header before anything is
# proxied upstream (nginx/conf.d/README.md rule 16). An upstream that receives
# it holds — and probably access-logs — a credential valid for every host on
# .apps.<domain> (ADR-0015). The application's own cookies pass through
# untouched, which is why this is a rewrite of the header rather than dropping
# it: an application that loses its own session cookie is broken, not secured.
# --- Feature End ---
#
# One pass, four positions. ponytail: a chunked session (`_oauth2_proxy_0`…)
# would need one pass per chunk, and the measured cookie is a fixed 192 bytes
# that never chunks (docs/07). If that ever changes, chain a second map.
map $http_cookie $upstream_cookie {
    default                                                                  $http_cookie;
    "~^_oauth2_proxy(?:_\d+)?=[^;]*$"                                        "";
    "~^_oauth2_proxy(?:_\d+)?=[^;]*;\s*(?<tail>.*)$"                         $tail;
    "~^(?<head>.*?);\s*_oauth2_proxy(?:_\d+)?=[^;]*$"                        $head;
    "~^(?<head2>.*?);\s*_oauth2_proxy(?:_\d+)?=[^;]*;\s*(?<tail2>.*)$"       "${head2}; ${tail2}";
}

# WebSocket upgrades on protected locations. Revocation on an already-open
# connection is outside the N-03 guarantee (ADR-0016, measured in docs/07).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
