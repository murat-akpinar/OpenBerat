# http-level pieces the authorisation wiring needs. The `.inc` files beside this
# one are the parts that go *inside* a server or a location; they are not named
# `.conf` because nginx.conf includes `conf.d/*.conf` into `http` and a bare
# `location` block there is a syntax error.
#
#   errors.inc     @signin / @denied / @unavailable   -> server level
#   decide.inc     location = /decide                 -> server level
#   protected.inc  auth_request and the header rewrite -> inside a location

# --- Feature Start ---
# The session cookie is removed from the Cookie header before anything is
# proxied upstream (nginx/conf.d/README.md rule 16). An upstream that receives
# it holds — and probably access-logs — a credential valid for every host on
# .apps.<domain> (ADR-0015). The application's own cookies pass through
# untouched, which is why this is a rewrite of the header rather than dropping
# it: an application that loses its own session cookie is broken, not secured.
# --- Feature End ---
#
# One pass, four positions. ponytail: a chunked session (`_oauth2_proxy_0`…)
# would need one pass per chunk, and the measured cookie is a fixed 192 bytes
# that never chunks (docs/07). If that ever changes, chain a second map.
map $http_cookie $upstream_cookie {
    default                                                                  $http_cookie;
    "~^_oauth2_proxy(?:_\d+)?=[^;]*$"                                        "";
    "~^_oauth2_proxy(?:_\d+)?=[^;]*;\s*(?<tail>.*)$"                         $tail;
    "~^(?<head>.*?);\s*_oauth2_proxy(?:_\d+)?=[^;]*$"                        $head;
    "~^(?<head2>.*?);\s*_oauth2_proxy(?:_\d+)?=[^;]*;\s*(?<tail2>.*)$"       "${head2}; ${tail2}";
}

# --- Feature Start ---
# Declared here, at http level, and not only where they are used. nginx refuses
# to start if `log_format` names a variable nothing has declared — and the
# things that declare these are the protected locations, which on a fresh
# install do not exist yet, because no application has been defined. Removing
# the hand-written application blocks was enough to make nginx fail to boot with
# `unknown "deny_reason" variable`, on exactly the install where nobody has
# anything to compare against. A location that sets them for real overrides
# these.
# --- Feature End ---
auth_request_set $auth_subject  $upstream_http_x_auth_subject;
auth_request_set $auth_username $upstream_http_x_auth_username;
auth_request_set $auth_email    $upstream_http_x_auth_email;
auth_request_set $auth_groups   $upstream_http_x_auth_groups;
auth_request_set $auth_cookie   $upstream_http_set_cookie;
auth_request_set $deny_reason   $upstream_http_x_deny_reason;

# WebSocket upgrades on protected locations. Revocation on an already-open
# connection is outside the N-03 guarantee (ADR-0016, measured in docs/07).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Feature Start ---
# Rate limiting, pulled forward from Phase 6 because everything in this product
# funnels through one backend: a flood does not degrade one application, it
# takes authorisation away from all of them, and fail-closed turns that into a
# total outage. The login zone is the sharper one — every request through it
# reaches Keycloak, which is the slowest thing in the chain and the one worth
# attacking.
# --- Feature End ---
#
# Both numbers are a guess and are written down as one: N-07 (target concurrent
# users) is still an open question in docs/06, and the case that will break
# these first is a site behind NAT, where one $binary_remote_addr is an entire
# office. Raise `rate`, not `burst`, when that happens — burst only buys a
# larger spike.
limit_req_zone $binary_remote_addr zone=decisions:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=login:1m      rate=5r/s;

# Not 503: a 5xx here would be caught by error_page and served as the
# "unavailable" page, which says the access control service is down when in
# fact it is working exactly as configured.
limit_req_status 429;
