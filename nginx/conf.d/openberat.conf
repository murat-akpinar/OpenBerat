# PEP virtual hosts. The real servers (portal + the generated per-application
# blocks, ADR-0011) are wired in Phase 1 — the auth_request semantics they
# depend on are still on the VERIFY list (TODO.md).

# 80 is not published on the host; the redirect costs nothing and behaves
# right if it ever is.
server {
    listen 80 default_server;
    return 301 https://$host$request_uri;
}

# The wildcard certificate is the operator's (INSTALL.md §1) — mounted at
# /etc/nginx/certs, never committed, never baked.
server {
    listen 443 ssl default_server;
    http2 on;
    ssl_certificate     /etc/nginx/certs/wildcard.crt;
    ssl_certificate_key /etc/nginx/certs/wildcard.key;
    root /usr/share/nginx/html;
}
