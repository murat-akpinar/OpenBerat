# A child of keycloak.v2, not a copy of it: only the palette is ours. Overriding
# the .ftl templates would mean owning FreeMarker that Keycloak rewrites between
# releases, and a template that stops matching its theme breaks the one page
# every user has to get through.
parent=keycloak.v2

# The parent's sheet has to be named again — a child's `styles` replaces the
# inherited list rather than extending it. Ours comes last so it wins on order.
styles=css/styles.css css/openberat.css
