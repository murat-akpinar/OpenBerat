<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenBerat</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/portal.css">
<body>
<header class="site-header">
  <div class="bar">
    <a class="brand" href="/">
      <img class="mark" src="/logo.svg" alt="" width="32" height="32">
      <span class="wordmark">Open<span class="wordmark-accent">Berat</span></span>
    </a>
    <div class="session">
      <!-- Revealed by portal.js when /api/me answers `admin`. Hiding it is a
           convenience and nothing else: /api/admin/* checks ADMIN_GROUP on the
           handler's first line, so a user who types the URL gets a page that
           says 403 rather than a page with data on it (ADR-0026). -->
      <a class="signout" id="admin-link" href="/audit" hidden>Audit</a>
      <p class="identity" id="whoami"></p>
      <!-- The href is the fallback, not decoration: /oauth2/sign_out is steps
           1 and 2 on its own (oauth2-proxy.cfg, backend_logout_url), so a
           browser that never ran portal.js still signs out. The script sends
           POST /api/logout instead, which is all three in the right order. -->
      <a class="signout" id="signout" href="/oauth2/sign_out?rd=%2F">Sign out</a>
    </div>
  </div>
</header>
<main>
  <h1>Your <span class="accent">applications</span></h1>
  <p id="notice" class="prose notice" role="status" hidden></p>
  <div id="apps"></div>
</main>
<script src="/portal.js"></script>
</body>
</html>
