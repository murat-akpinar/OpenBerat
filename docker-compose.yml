# The whole stack: nginx + oauth2-proxy + redis + backend + postgres + keycloak
#                  + samba-ad (lab, ADR-0010) + sample applications (lab: one
#                  plain + one WebSocket — TODO.md Phase 1)
# Startup order and verification steps: TODO.md "Phase 1 — Lab"
#
# Two networks (docs/02 "Deployment"); nginx is the only member of both:
#   edge: nginx + the protected sample applications. Nothing else — an upstream
#         that can reach backend:8081, redis or postgres can skip nginx entirely,
#         and `internal;` on /decide only constrains nginx's own routing.
#   core: nginx + backend + oauth2-proxy + keycloak + postgres + redis + samba-ad.
# No service publishes ports except nginx :443.
# The frontend is not a service: its files are baked into the nginx image (ADR-0020).

name: openberat

services:
  # `restart: unless-stopped` on every service, for one demonstrated reason:
  # oauth2-proxy performs OIDC discovery once at startup and exits if Keycloak
  # is not answering yet. depends_on waits for the container, not for
  # readiness, so first boot is a race the proxy loses permanently. The same
  # applies to a host reboot for all of them.
  nginx:
    restart: unless-stopped
    # Named so that break-glass below is literally the same image and not a
    # second build that could drift from it (ADR-0017).
    image: openberat-nginx
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "443:443"
    volumes:
      # The wildcard certificate is the operator's (TODO.md Phase 1, first
      # item). Secrets are never baked into an image, so this is the one mount.
      - ./certs:/etc/nginx/certs:ro
      # The generated application blocks (ADR-0011) — the one relaxation of the
      # "configuration is baked into the image" rule, and the only thing the
      # backend and nginx share.
      - apps_conf:/etc/nginx/conf.d/generated
    networks:
      edge:
      core:
        # oauth2-proxy validates the token's `iss` against the URL the browser
        # used, so it has to reach Keycloak by that same name — through nginx,
        # not at keycloak:8080. This alias is what makes the name resolve
        # inside `core`.
        aliases: [auth.apps.example.local]

  backend:
    restart: unless-stopped
    build: ./backend
    environment:
      DATABASE_URL: postgres://openberat:${POSTGRES_PASSWORD}@postgres:5432/openberat
      REDIS_URL: redis://redis:6379
      # No default in the code: a default here would be a silent fallback to a
      # name that may not resolve, and /decide would report an outage instead of
      # a misconfiguration.
      OAUTH2_PROXY_URL: http://oauth2-proxy:4180
      # The kill switch's first step (ADR-0019). The service account is its
      # own client, not the realm administrator: `manage-users` on one client
      # is the narrowest role Keycloak has for logout-all, and KC_ADMIN_PASSWORD
      # here would hand password resets to whoever reads this environment.
      # KEYCLOAK_REALM and KEYCLOAK_CLIENT_ID default to the realm export's own.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_CLIENT_SECRET: ${OPENBERAT_BACKEND_SECRET}
      # The management plane. ADMIN_GROUP has a default (ADR-0008);
      # PORTAL_ORIGIN deliberately does not — a default would be an Origin
      # check that passes for somebody else's portal.
      ADMIN_GROUP: ${ADMIN_GROUP:-OpenBerat-Admins}
      PORTAL_ORIGIN: https://portal.apps.example.local
      NGINX_CONF_DIR: /generated
    volumes:
      - apps_conf:/generated
    depends_on: [postgres, redis]
    networks: [core]

  # --- Break-glass (ADR-0017) ------------------------------------------------
  # Inert: `profiles` keeps it out of every ordinary `docker compose` command,
  # and it takes the same :443 as nginx, so starting it means stopping that one
  # first. Both of those are deliberate — this serves the applications with no
  # authorisation at all, and it must not be something that happens by itself.
  # The procedure is docs/08-breakglass.md.
  nginx-breakglass:
    profiles: [breakglass]
    restart: unless-stopped
    image: openberat-nginx
    build:
      context: .
      dockerfile: nginx/Dockerfile
    command: ["nginx", "-c", "/etc/nginx/breakglass.conf", "-g", "daemon off;"]
    ports:
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    # `edge` only. It has no business reaching the backend, Redis or Postgres —
    # it is not making decisions, and an incident is the wrong moment to widen
    # what a container can talk to.
    networks: [edge]

  oauth2-proxy:
    restart: unless-stopped
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.2
    command: ["--config=/etc/oauth2-proxy/oauth2-proxy.cfg"]
    environment:
      # Secrets never live in the committed config; the environment overrides
      # the file. cookie_secret must be 16, 24 or 32 bytes (INSTALL.md §3).
      OAUTH2_PROXY_CLIENT_SECRET: ${OPENBERAT_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
    volumes:
      - ./oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
      # The public half of the wildcard certificate only — the lab CA is
      # self-signed and the issuer is reached over HTTPS.
      - ./certs/wildcard.crt:/etc/ssl/openberat/wildcard.crt:ro
    depends_on: [keycloak, redis]
    networks: [core]

  keycloak:
    restart: unless-stopped
    # Built, not stock, since the login theme arrived: a theme is read at
    # runtime, so it is baked in rather than mounted (keycloak/Dockerfile).
    # The context is the repository root because the mark comes from frontend/.
    build:
      context: .
      dockerfile: keycloak/Dockerfile
    # ponytail: start-dev + embedded H2 is lab-only; the production database
    # and hostname settings are an INSTALL.md item (Phase 1). H2 deliberately
    # gets no volume — the realm is reproduced by re-importing the export
    # (keycloak/README.md), so persisting a dev database would only preserve
    # hand-made drift the import is supposed to prevent.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_PROXY_HEADERS: xforwarded
      # Read by the realm export at import (keycloak/README.md): the public
      # repository carries placeholders, the real values arrive here.
      OPENBERAT_CLIENT_SECRET: ${OPENBERAT_CLIENT_SECRET}
      OPENBERAT_BACKEND_SECRET: ${OPENBERAT_BACKEND_SECRET}
      AD_BIND_PASSWORD: ${AD_BIND_PASSWORD}
    volumes:
      # Realm export lands here in Phase 1 (keycloak/README.md); an empty dir
      # is skipped by --import-realm, so first boot works either way.
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    networks: [core]

  postgres:
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openberat
      POSTGRES_DB: openberat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [core]

  redis:
    restart: unless-stopped
    # Sessions and the sub → session index (ADR-0019) are both re-creatable;
    # no volume — losing them only signs users in again.
    image: redis:7-alpine
    networks: [core]

  samba-ad:
    restart: unless-stopped
    # Lab directory only, ships in no release (ADR-0010). Test users, nested
    # groups and disabled accounts are provisioned here in Phase 1. Pinned by
    # digest like every other image: the fixture is only reproducible if the
    # directory it is built in is.
    image: nowsci/samba-domain@sha256:ce27adb35a4cf04a14fc9f98d3cbac00e1f4429ba5e1c4f663919101f98c6f88
    # Samba refuses to provision when the DC's short name equals the domain's
    # NetBIOS name — `hostname: ad` with `ad.example.local` is a fatal
    # `Domain 'AD' must not be equal to short host name 'AD'`. dc01 in
    # example.local is the pair docs/03 already documents.
    hostname: dc01
    environment:
      DOMAIN: ${AD_DOMAIN}
      DOMAINPASS: ${AD_ADMIN_PASSWORD}
      # Lab fixture passwords are not AD-complex; without this the fixture
      # script fails halfway and leaves a half-populated directory.
      NOCOMPLEXITY: "true"
    networks:
      core:
        # Keycloak reaches the DC by the name its LDAPS certificate carries.
        aliases: [dc01.example.local]

  # The two protected sample applications (lab): one plain HTTP, one WebSocket.
  # On edge only — all they can reach is nginx.
  sample-app:
    restart: unless-stopped
    image: traefik/whoami:v1.11
    networks: [edge]

  sample-ws:
    restart: unless-stopped
    image: jmalloc/echo-server:v0.3.7
    networks: [edge]

networks:
  edge:
  core:

volumes:
  pg_data:
  apps_conf:
