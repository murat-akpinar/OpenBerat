# The checks a human forgets: every commit is signed off (DCO, ADR-0018), the
# documents' links still resolve, every file says what licence it is under,
# nginx and the frontend have not lost a security rule that neither `nginx -t`
# nor a build step would notice, and the backend still compiles and its tests
# pass.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dco:
    name: dco sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          fail=
          for c in $(git rev-list --no-merges ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format=%B "$c" | grep -qEi '^Signed-off-by: .+ <.+@.+>'; then
              echo "missing Signed-off-by: $(git log -1 --oneline "$c")"
              fail=1
            fi
          done
          if [ -n "$fail" ]; then
            echo "Sign your commits: git commit -s  (see CONTRIBUTING.md)"
            exit 1
          fi

  docs:
    name: docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Links broke twice in one session by gitignoring a linked file, so this
      # checks the target is in git, not merely on someone's disk.
      - run: |
          python3 - <<'EOF'
          import re, pathlib, subprocess, sys
          tracked = set(subprocess.run(['git','ls-files'], capture_output=True, text=True).stdout.split())
          bad = []
          for md in sorted(pathlib.Path('.').rglob('*.md')):
              for m in re.finditer(r'\[([^\]]*)\]\(([^)]+)\)', md.read_text()):
                  t = m.group(2)
                  if t.startswith(('http', '#', 'mailto:')):
                      continue
                  rel = (md.parent / t.split('#')[0]).resolve().relative_to(pathlib.Path('.').resolve())
                  if str(rel) not in tracked and not (rel.is_dir() and any(str(f).startswith(str(rel)) for f in map(pathlib.Path, tracked))):
                      bad.append(f'{md}: {t}')
          print('\n'.join(bad) if bad else 'all links resolve inside the repository')
          sys.exit(1 if bad else 0)
          EOF

  licence:
    name: licence headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A file with no notice is a file somebody can copy out of here without
      # knowing what it is under (ADR-0013). Nothing enforces this at build
      # time, and the file most easily forgotten is the vendored one, whose
      # licence is not ours to change.
      - run: |
          python3 - <<'EOF'
          import pathlib, subprocess, sys

          # No VENDOR map: ADR-0027 deleted the one third-party file, so every
          # file in the tree is ours and under one licence (ADR-0013).
          OURS = 'SPDX-License-Identifier: GPL-3.0-or-later'
          # Images carry no comments, and the documents are covered by LICENSE
          # at the root rather than one notice per paragraph.
          CODE = {'.rs', '.js', '.html', '.css', '.sql', '.sh', '.conf', '.inc',
                  '.yml', '.yaml', '.properties', '.template'}
          NAMED = {'Dockerfile', 'nginx.conf'}
          # Applied migrations are content-addressed: sqlx stores a checksum of
          # each file and refuses to start when one changes. A licence header in
          # `backend/migrations/` is therefore not a comment, it is an upgrade
          # that bricks every existing installation — measured, docs/07.
          IMMUTABLE = 'backend/migrations/'

          bad = []
          for name in subprocess.run(['git', 'ls-files'], capture_output=True, text=True).stdout.split():
              path = pathlib.Path(name)
              if name.startswith(IMMUTABLE):
                  if OURS in path.read_text(errors='replace'):
                      bad.append(f'{name}: an applied migration must not gain a header')
                  continue
              if path.suffix not in CODE and path.name not in NAMED:
                  continue
              if OURS not in path.read_text(errors='replace'):
                  bad.append(f'{name}: no `{OURS}`')
          print('\n'.join(bad) if bad else 'every file says what licence it is under')
          sys.exit(1 if bad else 0)
          EOF

  nginx:
    name: nginx config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `nginx -t` is happy with a location that is wide open, so this looks for
      # the one mistake it cannot see (nginx/conf.d/README.md rules 12 and 14).
      - run: |
          python3 - <<'EOF'
          # Every location that carries auth_request must be answered from the content
          # phase. `return` runs in the rewrite phase, before the access phase where
          # auth_request lives: the subrequest never fires, the location is wide open,
          # and `nginx -t` says the configuration is fine (measured, docs/07 — rule 14).
          # try_files without `=404` last internally redirects, which re-runs the access
          # phase and loses the refreshed session cookie (rule 12).
          import pathlib, re, sys

          conf = pathlib.Path('nginx/conf.d')
          inc = {p.name: p.read_text() for p in conf.glob('*.inc')}

          def expand(text, seen=()):
              def sub(m):
                  name = m.group(1)
                  if name in seen or name not in inc:
                      return ''
                  return expand(inc[name], seen + (name,))
              return re.sub(r'include\s+/etc/nginx/conf\.d/([\w.-]+);', sub, text)

          def blocks(text):
              """Yield (header, body) for every location block, brace-aware."""
              for m in re.finditer(r'^\s*(location\s[^{]*)\{', text, re.M):
                  depth, i = 1, m.end()
                  while depth and i < len(text):
                      depth += (text[i] == '{') - (text[i] == '}')
                      i += 1
                  yield m.group(1).strip(), text[m.end():i - 1]

          def bodies(path):
              text = expand(path.read_text())
              found = list(blocks(text))
              # protected.inc is a location body without the `location` line, so
              # nothing above would look inside it — and it is the one file whose
              # add_header reaches every application.
              return found or [(path.name, text)]

          bad = []
          for path in sorted([*conf.glob('*.conf*'), *conf.glob('*.inc')]):
              for header, body in bodies(path):
                  body = re.sub(r'#.*', '', body)
                  # nginx inherits add_header by *replacement*: one add_header in a
                  # location drops every header set above it, silently. The security
                  # headers live at http level, so any location writing a header of
                  # its own has to pull security.inc back in (rule 19).
                  if 'add_header' in body and 'Strict-Transport-Security' not in body:
                      bad.append(f'{path.name}: `{header}` has its own add_header and does not include security.inc')
                  if 'auth_request' not in body:
                      continue
                  if re.search(r'^\s*return\s', body, re.M):
                      bad.append(f'{path.name}: `{header}` carries auth_request and answers with return')
                  for tf in re.findall(r'^\s*try_files\s+([^;]+);', body, re.M):
                      if not tf.split()[-1].startswith('='):
                          bad.append(f'{path.name}: `{header}` try_files does not end in =CODE, so it redirects internally')
          print('\n'.join(bad) if bad else 'every auth_request location answers from the content phase')
          sys.exit(1 if bad else 0)
          EOF
      # nginx forwards every header it is not told to overwrite, so a header no
      # location pins is one the client writes for the upstream. `nginx -t` has
      # nothing to say about it and neither did any test (rule 24).
      - run: |
          python3 - <<'EOF'
          # nginx forwards every header it is not told to overwrite, so a header this
          # proxy does not pin is a header the client writes for the upstream. The
          # X-Auth-* family is stripped with care in four files; the X-Forwarded-* one
          # was pinned by halves (rule 24).
          import pathlib, re, sys

          conf = pathlib.Path('nginx/conf.d')
          inc = {p.name: p.read_text() for p in conf.glob('*.inc')}

          def expand(text, seen=()):
              def sub(m):
                  name = m.group(1)
                  if name in seen or name not in inc:
                      return ''
                  return expand(inc[name], seen + (name,))
              return re.sub(r'include\s+/etc/nginx/conf\.d/([\w.-]+);', sub, text)

          def blocks(text):
              for m in re.finditer(r'^\s*(location\s[^{]*)\{', text, re.M):
                  depth, i = 1, m.end()
                  while depth and i < len(text):
                      depth += (text[i] == '{') - (text[i] == '}')
                      i += 1
                  yield m.group(1).strip(), text[m.end():i - 1]

          def bodies(path):
              text = expand(path.read_text())
              return list(blocks(text)) or [(path.name, text)]

          # Every hop pins all four: the two a client can forge into an absolute URL
          # (Host, Port) as much as the two that were already there.
          PINNED = ('X-Forwarded-For', 'X-Forwarded-Host', 'X-Forwarded-Port', 'X-Forwarded-Proto')
          # The two hops that reach somebody else's application. These names are not
          # forwarded at all: a framework that honours them re-routes off a client header.
          THIRD_PARTY = {'protected.inc', 'upstream.inc'}
          CLEARED = ('X-Forwarded-Prefix', 'X-Original-URL', 'X-Rewrite-URL')

          bad = set()
          # `*.conf*` and not `*.conf`: two of these files are `.conf.template`
          # (the domain is substituted at container start), and a glob that
          # missed them would drop every rule in them out of this check without
          # failing anything.
          files = sorted([*conf.glob('*.conf*'), *conf.glob('*.inc'),
                          *pathlib.Path('nginx/breakglass').glob('*.inc')])
          for path in files:
              # Comments off first: this file explains why the appending form is wrong,
              # and a check that cannot read its own rationale flags the rule that states it.
              if '$proxy_add_x_forwarded_for' in re.sub(r'#.*', '', path.read_text()):
                  bad.add(f'{path.name}: $proxy_add_x_forwarded_for keeps what the client sent; nginx is the only edge, so it is $remote_addr')
              for header, body in bodies(path):
                  body = re.sub(r'#.*', '', body)
                  if 'proxy_set_header' not in body:
                      continue
                  for name in PINNED:
                      if not re.search(rf'proxy_set_header\s+{name}\s', body, re.I):
                          bad.add(f'{path.name}: `{header}` shapes an upstream request and does not pin {name}')
                  if path.name in THIRD_PARTY:
                      for name in CLEARED:
                          if not re.search(rf'proxy_set_header\s+{name}\s+""', body, re.I):
                              bad.add(f'{path.name}: `{header}` reaches a third-party upstream and does not clear {name}')
          print('\n'.join(sorted(bad)) if bad else 'every upstream hop pins the whole X-Forwarded-* family')
          sys.exit(1 if bad else 0)
          EOF
      # An include is shared by every application, so a hostname in one is the
      # deployment's hostname written where the deployment never looks (rule 25).
      - run: |
          python3 - <<'EOF'
          # A shared include is used by every application, so a hostname written into one
          # is the deployment's hostname written somewhere the deployment does not look.
          # `errors.inc` carried the portal's, and `@denied` is included by every block
          # ADR-0011 generates: on any install that is not the lab, every refused user was
          # sent to a host that does not exist (rule 25).
          import pathlib, re, sys

          bad = []
          for path in sorted([*pathlib.Path('nginx/conf.d').glob('*.inc'),
                              *pathlib.Path('nginx/breakglass').glob('*.inc')]):
              body = re.sub(r'#.*', '', path.read_text())
              for m in re.finditer(r'https?://(.)', body):
                  if m.group(1) != '$':
                      line = body[:m.start()].count('\n') + 1
                      bad.append(f'{path.name}:{line}: a shared include names a host literally; use a variable')
          print('\n'.join(bad) if bad else 'no shared include carries a literal hostname')
          sys.exit(1 if bad else 0)
          EOF
      # `worker_shutdown_timeout` is main-context, so unlike the TLS and header
      # settings it cannot live in a shared include: it is written twice, and
      # the two copies have to agree (ADR-0025).
      - run: |
          python3 - <<'EOF'
          import pathlib, re, sys

          found = {}
          for name in ('nginx/nginx.conf', 'nginx/breakglass.conf'):
              m = re.search(r'^\s*worker_shutdown_timeout\s+(\S+);',
                            pathlib.Path(name).read_text(), re.M)
              found[name] = m.group(1) if m else None
          if None in found.values() or len(set(found.values())) != 1:
              print(f'worker_shutdown_timeout must be set, to the same value, in both: {found}')
              sys.exit(1)
          print(f'worker_shutdown_timeout {next(iter(found.values()))} in both configurations')
          EOF

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # There is no build step to catch this and no linter in the repository
      # (ADR-0007), so the two rules the frontend lives by are checked here.
      - run: |
          python3 - <<'EOF'
          # The portal renders strings an admin typed (application name, icon) on the
          # one host every user opens, and the session cookie it carries is valid for
          # every application on .apps.<domain> (ADR-0015). So the frontend may only
          # write text, never markup. It carries no inline script either: that is what
          # lets a `default-src 'self'` CSP land without `unsafe-inline`.
          import pathlib, re, sys

          # No exception for a vendor directory: ADR-0027 removed the only file that
          # had one, so this runs over every page the image serves. The rule it
          # enforces is guarded by this grep and nothing else — ADR-0007 bought no
          # build step — which is also the reason no templating syntax was adopted:
          # `x-html` is an attribute and matches none of these.
          SINKS = r'innerHTML|outerHTML|insertAdjacentHTML|document\.write|eval\s*\(|new\s+Function'
          bad = []
          for path in sorted(pathlib.Path('frontend/src').rglob('*')):
              if path.suffix not in ('.html', '.js'):
                  continue
              text = path.read_text()
              for m in re.finditer(SINKS, text):
                  bad.append(f'{path}: writes markup instead of text ({m.group(0)})')
              if path.suffix == '.html':
                  if re.search(r'<script(?![^>]*\ssrc=)[^>]*>\s*\S', text):
                      bad.append(f'{path}: inline <script> needs unsafe-inline in the CSP')
                  if re.search(r'<[^>]*?\son[a-z]+\s*=', text):
                      bad.append(f'{path}: inline event handler needs unsafe-inline in the CSP')
          print('\n'.join(bad) if bad else 'text only, no inline script, nothing vendored at all')
          sys.exit(1 if bad else 0)
          EOF

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The schema test skips itself without DATABASE_URL, so without this service
    # the migration would reach an operator having never been executed.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: openberat
          POSTGRES_PASSWORD: test
          POSTGRES_DB: openberat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openberat"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://openberat:test@localhost:5432/openberat
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      # ponytail: no build cache, cold builds take a few minutes. Add one when it annoys someone.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
