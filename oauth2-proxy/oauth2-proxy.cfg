# Keycloak OIDC client + Redis session store. All authentication happens here
# (ADR-0003). What each setting means: README.md and docs/04-provisioning.md.
#
# Secrets are NOT in this file — the repository is public. `client_secret` and
# `cookie_secret` arrive as OAUTH2_PROXY_CLIENT_SECRET / _COOKIE_SECRET from
# .env; oauth2-proxy's environment overrides the config file.
#
# The four settings that carry a deployment's domain are **not here** either,
# and for the same reason the secrets are not: they are the installation's, not
# this repository's. `oidc_issuer_url`, `redirect_url`, `cookie_domains` and
# `whitelist_domains` arrive as OAUTH2_PROXY_* variables built from
# `APPS_DOMAIN` in `docker-compose.yml`, where every other use of that variable
# is visible at once. A value written here as well would be the copy that goes
# stale — the environment wins silently, so the file would keep saying
# something true of nobody's install.

http_address = "0.0.0.0:4180"
reverse_proxy = true            # trust nginx's X-Forwarded-* — it is the only client

# --- Provider ---------------------------------------------------------------
# `oidc_issuer_url` and `redirect_url` are in the environment (see the header).
# The issuer is the URL the *browser* uses, so it goes through nginx rather than
# to keycloak:8080 — the token's `iss` has to match what is validated here.
# nginx carries an `auth.${APPS_DOMAIN}` alias on the core network for it.
provider          = "keycloak-oidc"
provider_display_name = "OpenBerat"
client_id         = "openberat-proxy"
provider_ca_files = ["/etc/ssl/openberat/wildcard.crt"]   # the lab CA is self-signed
# No `groups` scope: the claim comes from a mapper on the client itself, so it
# is in every token rather than something the caller has to ask for.
scope             = "openid profile email"
skip_provider_button = true     # one provider; the interstitial is a dead click
# Keycloak advertises S256 and oauth2-proxy leaves PKCE off unless asked. It
# binds the authorization code to this client, so a code leaked from the
# browser's history, a proxy log or a referrer cannot be redeemed by anyone else.
code_challenge_method = "S256"

# Any authenticated account is let through the door; *which* applications it
# reaches is the backend's decision (docs/05), never oauth2-proxy's.
email_domains = ["*"]

# --- The three settings that default to the wrong value (docs/04) ------------
set_xauthrequest   = true       # off by default → no identity header reaches the backend
cookie_refresh     = "5m"       # off by default → groups stay stale for cookie_expire
session_store_type = "redis"    # cookie by default → the kill switch cannot revoke

# Step 2 of the logout (docs/02): oauth2-proxy calls this back-channel while
# handling /oauth2/sign_out, with the session's own id_token as the hint.
# Without it the IdP session outlives the sign-out and the next login is granted
# with no password prompt — measured, both ways, in docs/07. Redirecting the
# browser to the same endpoint is not the alternative: the browser has never
# held an id_token, and without the hint Keycloak stops on a confirmation page.
# The internal address, like the backend's kill switch: no browser is involved.
backend_logout_url = "http://keycloak:8080/realms/openberat/protocol/openid-connect/logout?id_token_hint={id_token}"

redis_connection_url = "redis://redis:6379"

# --- Feature Start ---
# nginx is the only client, and it already logs every one of these requests —
# so this log is a second copy, and the second copy is the one that still had
# the OAuth authorization code in it after nginx started redacting its own
# (conf.d/logredact.inc). oauth2-proxy has no redaction of its own. Only the
# request log goes: `auth_logging` keeps the [AuthSuccess]/[AuthFailure] lines
# and standard logging keeps the startup errors INSTALL.md sends people to.
request_logging = false
# --- Feature End ---

# --- Session cookie (ADR-0015) ----------------------------------------------
# Shared across `.${APPS_DOMAIN}` so one login covers every protected host;
# `cookie_domains` is in the environment with the other three (see the header).
# `__Host-` is unavailable by construction: it forces a host-only cookie.
cookie_name     = "_oauth2_proxy"
cookie_secure   = true
cookie_httponly = true
cookie_samesite = "lax"
# --- Feature Start ---
# The same 10 hours the realm gives an SSO session (`ssoSessionMaxLifespan`),
# and not oauth2-proxy's 168 h default: past that the Keycloak session is over
# whatever this cookie says, so a longer life buys a user nothing and leaves a
# session-shaped object in Redis for the rest of the week — counted by
# `/api/admin/sessions` as a credential that would still let somebody in, when
# it would not (ADR-0028, measured in docs/04's table). The four numbers that
# decide how long a session lasts belong together: `docs/04`, "How long a
# session lasts".
cookie_expire   = "10h"
# --- Feature End ---

# --- Feature Start ---
# One page load starts more than one login flow — the document 401s and so does
# the favicon fetched beside it — and with a single CSRF cookie name the second
# flow's cookie replaces the first's. The callback that then arrives for the
# first flow either finds a cookie carrying another flow's PKCE verifier, which
# Keycloak refuses (500), or, once the winner has cleared it, no cookie at all
# (403, "Unable to find a valid CSRF token"). Both reproduced on the lab
# (docs/07). Naming the cookie after the state gives each flow its own.
cookie_csrf_per_request = true
# --- Feature End ---

# A ?rd= redirect may only return to a host under our parent domain; without
# this an open redirect walks the user off to somewhere else after login.
# `whitelist_domains` is in the environment with the other three (see header).
