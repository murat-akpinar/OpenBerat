# Keycloak OIDC client + Redis session store. All authentication happens here
# (ADR-0003). What each setting means: README.md and docs/04-provisioning.md.
#
# Secrets are NOT in this file — the repository is public. `client_secret` and
# `cookie_secret` arrive as OAUTH2_PROXY_CLIENT_SECRET / _COOKIE_SECRET from
# .env; oauth2-proxy's environment overrides the config file.
#
# ponytail: the lab domain `example.local` is written out here, in the nginx
# server blocks and in the realm export. One domain, three files. Upgrade path
# when a second deployment exists: nginx's own /etc/nginx/templates envsubst
# pass plus OAUTH2_PROXY_* env overrides, both already supported by the images.

http_address = "0.0.0.0:4180"
reverse_proxy = true            # trust nginx's X-Forwarded-* — it is the only client

# --- Provider ---------------------------------------------------------------
# The issuer is the URL the *browser* uses, so it goes through nginx rather than
# to keycloak:8080 — the token's `iss` has to match what is validated here.
# nginx carries an `auth.apps.example.local` alias on the core network for it.
provider          = "keycloak-oidc"
provider_display_name = "OpenBerat"
oidc_issuer_url   = "https://auth.apps.example.local/realms/openberat"
client_id         = "openberat-proxy"
provider_ca_files = ["/etc/ssl/openberat/wildcard.crt"]   # the lab CA is self-signed
redirect_url      = "https://portal.apps.example.local/oauth2/callback"
# No `groups` scope: the claim comes from a mapper on the client itself, so it
# is in every token rather than something the caller has to ask for.
scope             = "openid profile email"
skip_provider_button = true     # one provider; the interstitial is a dead click
# Keycloak advertises S256 and oauth2-proxy leaves PKCE off unless asked. It
# binds the authorization code to this client, so a code leaked from the
# browser's history, a proxy log or a referrer cannot be redeemed by anyone else.
code_challenge_method = "S256"

# Any authenticated account is let through the door; *which* applications it
# reaches is the backend's decision (docs/05), never oauth2-proxy's.
email_domains = ["*"]

# --- The three settings that default to the wrong value (docs/04) ------------
set_xauthrequest   = true       # off by default → no identity header reaches the backend
cookie_refresh     = "5m"       # off by default → groups stay stale for cookie_expire
session_store_type = "redis"    # cookie by default → the kill switch cannot revoke

# Step 2 of the logout (docs/02): oauth2-proxy calls this back-channel while
# handling /oauth2/sign_out, with the session's own id_token as the hint.
# Without it the IdP session outlives the sign-out and the next login is granted
# with no password prompt — measured, both ways, in docs/07. Redirecting the
# browser to the same endpoint is not the alternative: the browser has never
# held an id_token, and without the hint Keycloak stops on a confirmation page.
# The internal address, like the backend's kill switch: no browser is involved.
backend_logout_url = "http://keycloak:8080/realms/openberat/protocol/openid-connect/logout?id_token_hint={id_token}"

redis_connection_url = "redis://redis:6379"

# --- Session cookie (ADR-0015) ----------------------------------------------
# Shared across .apps.example.local so one login covers every protected host.
# `__Host-` is unavailable by construction: it forces a host-only cookie.
cookie_name     = "_oauth2_proxy"
cookie_domains  = [".apps.example.local"]
cookie_secure   = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire   = "168h"

# A ?rd= redirect may only return to a host under our parent domain; without
# this an open redirect walks the user off to somewhere else after login.
whitelist_domains = [".apps.example.local"]
